<!-- CJX Platform — Legal | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">Legal</div>
    <div class="ph-sub">Legal matters, contracts, compliance, and regulatory tracking</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_legal('tp_legal_0',this)">Active Matters</button>
  <button class="tab-btn" onclick="swtab_legal('tp_legal_1',this)">Contracts</button>
  <button class="tab-btn" onclick="swtab_legal('tp_legal_2',this)">Compliance</button>
  <button class="tab-btn" onclick="swtab_legal('tp_legal_3',this)">Regulatory</button>
</div>
<div id="tp_legal_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Active Matters</div>
</div>
<div id="tp_legal_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Contracts</div>
</div>
<div id="tp_legal_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Compliance</div>
</div>
<div id="tp_legal_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Regulatory</div>
</div>
<script>
function swtab_legal(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
