<!-- CJX Platform — Site Negotiation | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">Site Negotiation</div>
    <div class="ph-sub">Active lease and deal negotiations — term sheets, landlord status, and key milestones</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_negotiation('tp_negotiation_0',this)">Active Deals</button>
  <button class="tab-btn" onclick="swtab_negotiation('tp_negotiation_1',this)">Term Sheet Tracker</button>
  <button class="tab-btn" onclick="swtab_negotiation('tp_negotiation_2',this)">Landlord Status</button>
  <button class="tab-btn" onclick="swtab_negotiation('tp_negotiation_3',this)">Milestones</button>
</div>
<div id="tp_negotiation_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Active Deals</div>
</div>
<div id="tp_negotiation_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Term Sheet Tracker</div>
</div>
<div id="tp_negotiation_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Landlord Status</div>
</div>
<div id="tp_negotiation_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Milestones</div>
</div>
<script>
function swtab_negotiation(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
