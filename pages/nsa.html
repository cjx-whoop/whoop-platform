<!-- CJX Platform — NSA | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">NSA</div>
    <div class="ph-sub">New store activation — opening checklist, readiness, and launch tracking</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_nsa('tp_nsa_0',this)">Opening Checklist</button>
  <button class="tab-btn" onclick="swtab_nsa('tp_nsa_1',this)">Readiness</button>
  <button class="tab-btn" onclick="swtab_nsa('tp_nsa_2',this)">Launch Tracking</button>
  <button class="tab-btn" onclick="swtab_nsa('tp_nsa_3',this)">Post-Open</button>
</div>
<div id="tp_nsa_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Opening Checklist</div>
</div>
<div id="tp_nsa_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Readiness</div>
</div>
<div id="tp_nsa_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Launch Tracking</div>
</div>
<div id="tp_nsa_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Post-Open</div>
</div>
<script>
function swtab_nsa(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
