<!-- CJX Platform — LPIC | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">LPIC</div>
    <div class="ph-sub">Loss prevention and inventory control — shrinkage, audits, and incidents</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_lpic('tp_lpic_0',this)">Shrinkage</button>
  <button class="tab-btn" onclick="swtab_lpic('tp_lpic_1',this)">Audits</button>
  <button class="tab-btn" onclick="swtab_lpic('tp_lpic_2',this)">Incidents</button>
  <button class="tab-btn" onclick="swtab_lpic('tp_lpic_3',this)">CCTV Alerts</button>
</div>
<div id="tp_lpic_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Shrinkage</div>
</div>
<div id="tp_lpic_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Audits</div>
</div>
<div id="tp_lpic_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Incidents</div>
</div>
<div id="tp_lpic_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: CCTV Alerts</div>
</div>
<script>
function swtab_lpic(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
