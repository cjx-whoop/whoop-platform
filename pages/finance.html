<!-- CJX Platform — A&F | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">A&F</div>
    <div class="ph-sub">P&L, budgets, cost control, and financial reporting</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_finance('tp_finance_0',this)">P&L</button>
  <button class="tab-btn" onclick="swtab_finance('tp_finance_1',this)">Budget vs Actual</button>
  <button class="tab-btn" onclick="swtab_finance('tp_finance_2',this)">Cost Control</button>
  <button class="tab-btn" onclick="swtab_finance('tp_finance_3',this)">Financial Reports</button>
</div>
<div id="tp_finance_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: P&L</div>
</div>
<div id="tp_finance_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Budget vs Actual</div>
</div>
<div id="tp_finance_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Cost Control</div>
</div>
<div id="tp_finance_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Financial Reports</div>
</div>
<script>
function swtab_finance(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
