<!-- CJX Platform — Marketing | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">Marketing</div>
    <div class="ph-sub">Campaigns, promotions, and marketing performance tracking</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_marketing('tp_marketing_0',this)">Campaigns</button>
  <button class="tab-btn" onclick="swtab_marketing('tp_marketing_1',this)">Promotions</button>
  <button class="tab-btn" onclick="swtab_marketing('tp_marketing_2',this)">Performance</button>
  <button class="tab-btn" onclick="swtab_marketing('tp_marketing_3',this)">Calendar</button>
</div>
<div id="tp_marketing_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Campaigns</div>
</div>
<div id="tp_marketing_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Promotions</div>
</div>
<div id="tp_marketing_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Performance</div>
</div>
<div id="tp_marketing_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Calendar</div>
</div>
<script>
function swtab_marketing(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
