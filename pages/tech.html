<!-- CJX Platform — Tech | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">Tech</div>
    <div class="ph-sub">Technology roadmap, systems health, and IT projects</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_tech('tp_tech_0',this)">Roadmap</button>
  <button class="tab-btn" onclick="swtab_tech('tp_tech_1',this)">Systems Health</button>
  <button class="tab-btn" onclick="swtab_tech('tp_tech_2',this)">Projects</button>
  <button class="tab-btn" onclick="swtab_tech('tp_tech_3',this)">Vendors</button>
</div>
<div id="tp_tech_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Roadmap</div>
</div>
<div id="tp_tech_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Systems Health</div>
</div>
<div id="tp_tech_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Projects</div>
</div>
<div id="tp_tech_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Vendors</div>
</div>
<script>
function swtab_tech(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
