<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CJX Platform</title>

<style>:root{
  --bg:#f0f2f5;--surface:#fff;--s2:#f7f8fa;--s3:#eef0f4;
  --border:#e3e6ed;--border2:#c8cdd9;
  --text:#0d1421;--t2:#4a5568;--t3:#8a93a8;--t4:#b8bece;
  --green:#0ca678;--gbg:#ecfdf5;--gmid:#a7f3d0;
  --yellow:#c67e00;--ybg:#fffbeb;--ymid:#fcd34d;
  --red:#dc2626;--rbg:#fef2f2;--rmid:#fca5a5;
  --blue:#1d4ed8;--bbg:#eff6ff;--bmid:#bfdbfe;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;line-height:1.5;}
.shell{display:grid;grid-template-columns:220px 1fr;grid-template-rows:52px 1fr;height:100vh;}
.topbar{grid-column:1/-1;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;}
.logo{font-weight:800;font-size:16px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;}
.logo-mark{width:28px;height:28px;background:var(--text);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;}
.tb-div{width:1px;height:18px;background:var(--border);}
.tb-lbl{font-size:12px;color:var(--t3);font-weight:500;}
.tb-sep{flex:1;}
.role-wrap{display:flex;align-items:center;gap:7px;}
.role-label{font-size:11px;color:var(--t3);font-weight:600;}
.role-sel{background:var(--s2);border:1px solid var(--border2);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--text);cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;outline:none;}
.live-pill{display:flex;align-items:center;gap:6px;background:var(--gbg);border:1px solid var(--gmid);border-radius:20px;padding:3px 10px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
.live-txt{font-size:11px;font-weight:700;color:var(--green);}
.tb-time{font-family:'Consolas','Courier New',monospace;font-size:11px;color:var(--t3);}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.75);}}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:14px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;overflow-x:hidden;}
.sidebar.collapsed{width:0!important;padding:0;border-right:none;}
.sidebar.collapsed *{display:none!important;}
.nav-sec{padding:10px 8px 3px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t4);font-weight:700;font-family:'Consolas','Courier New',monospace;}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:pointer;transition:all .12s;font-size:12.5px;color:var(--t2);font-weight:500;border-radius:7px;white-space:nowrap;overflow:hidden;}
.nav-item:hover{background:var(--s2);color:var(--text);}
.nav-item.active{background:var(--bbg);color:var(--blue);font-weight:600;}
.nav-icon{font-size:13px;width:16px;flex-shrink:0;text-align:center;}
.nav-sub{display:flex;align-items:center;gap:9px;padding:6px 10px 6px 22px;cursor:pointer;transition:all .12s;font-size:12px;color:var(--t2);font-weight:500;border-radius:7px;white-space:nowrap;overflow:hidden;}
.nav-sub:hover{background:var(--s2);color:var(--text);}
.nav-sub.active{background:var(--bbg);color:var(--blue);font-weight:600;}
.main{overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0;}
.ph{display:flex;align-items:flex-end;justify-content:space-between;}
.ph-title{font-weight:800;font-size:20px;letter-spacing:-.4px;}
.ph-sub{font-size:11px;color:var(--t3);margin-top:2px;font-family:'Consolas','Courier New',monospace;}
.tab-bar{display:flex;gap:2px;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:3px;flex-wrap:wrap;}
.tab-btn{padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer;border-radius:7px;border:none;background:none;color:var(--t3);transition:all .12s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.tab-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.tab-btn:hover:not(.active){color:var(--t2);}
.blank-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:480px;gap:16px;background:var(--surface);border:1px dashed var(--border2);border-radius:13px;}
.sec-blank{background:var(--s2);border:1px dashed var(--border2);border-radius:10px;padding:24px;text-align:center;color:var(--t4);font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;font-family:'Consolas','Courier New',monospace;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fadein{animation:fadeUp .25s ease both;}</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button id="hamburger" onclick="toggleSidebar()" style="background:none;border:none;cursor:pointer;padding:8px;font-size:18px;color:var(--t2);line-height:1;margin-right:4px;">☰</button>
    <div class="logo"><div class="logo-mark">CJX</div>CJX Platform</div>
    <div class="tb-div"></div>
    <div class="tb-lbl">Team Build</div>
    <div class="tb-sep"></div>
    <div class="live-pill"><div class="live-dot"></div><span class="live-txt">LIVE</span></div>
    <div class="tb-time" id="clock">--:--:--</div>
    <div class="tb-div"></div>
    <div class="role-wrap">
      <span class="role-label">Role</span>
      <select class="role-sel" id="roleSel" onchange="onRoleChange()">
        <optgroup label="Executive">
          <option value="md">Managing Director</option>
          <option value="bsa">Head of BSA</option>
        </optgroup>
        <optgroup label="Expansion">
          <option value="head-expansion">Head of Site Expansion</option>
          <option value="head-negotiation">Head of Site Negotiation</option>
          <option value="head-construction">Head of Construction</option>
        </optgroup>
        <optgroup label="Operation">
          <option value="head-operation">Head of Operation</option>
          <option value="head-lpic">Head of LPIC</option>
        </optgroup>
        <optgroup label="Sales & Supply">
          <option value="head-commercial">Head of Commercial</option>
          <option value="head-supplychain">Head of Supply Chain</option>
        </optgroup>
        <optgroup label="Activities">
          <option value="head-nsa">Head of NSA</option>
          <option value="head-storepartnership">Head of Store Partnership</option>
          <option value="head-marketing">Head of Marketing</option>
        </optgroup>
        <optgroup label="Backbone">
          <option value="head-af">Head of A&amp;F</option>
          <option value="head-sp">Head of S&amp;P</option>
          <option value="head-people">Head of People</option>
          <option value="head-legal">Head of Legal</option>
        </optgroup>
        <optgroup label="Field Operations">
          <option value="rm">Regional Manager (RM)</option>
          <option value="am">Area Manager (AM)</option>
          <option value="sm">Store Manager (SM)</option>
        </optgroup>
      </select>
    </div>
  </header>
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>
<script>

let role='md', page='me', sidebarCollapsed=false;

function startClock(){
  function tick(){const n=new Date(),el=document.getElementById('clock');if(el)el.textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')} ICT`;}
  tick();setInterval(tick,1000);
}

function toggleSidebar(){
  const s=document.getElementById('sidebar'),sh=document.querySelector('.shell'),b=document.getElementById('hamburger');
  if(!s||!sh)return;
  sidebarCollapsed=!sidebarCollapsed;
  if(sidebarCollapsed){s.classList.add('collapsed');sh.style.gridTemplateColumns='0px 1fr';if(b)b.style.opacity='.5';}
  else{s.classList.remove('collapsed');sh.style.gridTemplateColumns='220px 1fr';if(b)b.style.opacity='1';}
}

function defaultPage(r){return r==='bsa'?'bizcontrol':'me';}

function onRoleChange(){
  role=document.getElementById('roleSel').value;
  page=defaultPage(role);
  renderSidebar();renderDefault();
}

// ── SIDEBAR ──────────────────────────────────────────
function buildSidebar(r){
  const me   =`<div class="nav-item${page==='me'?' active':''}" onclick="goPage('me',this)"><span class="nav-icon">👤</span>Me</div>`;
  const team =`<div class="nav-item${page==='team'?' active':''}" onclick="goPage('team',this)"><span class="nav-icon">👥</span>Team</div>`;
  const biz  =`<div class="nav-item${page==='bizcontrol'?' active':''}" onclick="goPage('bizcontrol',this)"><span class="nav-icon">⊙</span>Business Control</div>`;
  const fnsec=`<div class="nav-sec">Functions</div>`;

  const expFull=`<div class="nav-fn-sec">Expansion</div>
    <div class="nav-sub" onclick="goPage('expansion',this)"><span class="nav-sub-icon">🗺</span>Site Expansion</div>
    <div class="nav-sub" onclick="goPage('negotiation',this)"><span class="nav-sub-icon">🤝</span>Site Negotiation</div>
    <div class="nav-sub" onclick="goPage('construction',this)"><span class="nav-sub-icon">🏗</span>Construction</div>`;
  const expOnly=`<div class="nav-fn-sec">Expansion</div><div class="nav-sub" onclick="goPage('expansion',this)"><span class="nav-sub-icon">🗺</span>Site Expansion</div>`;
  const negOnly=`<div class="nav-fn-sec">Expansion</div><div class="nav-sub" onclick="goPage('negotiation',this)"><span class="nav-sub-icon">🤝</span>Site Negotiation</div>`;
  const conOnly=`<div class="nav-fn-sec">Expansion</div><div class="nav-sub" onclick="goPage('construction',this)"><span class="nav-sub-icon">🏗</span>Construction</div>`;

  const opFull=`<div class="nav-fn-sec">Operation</div>
    <div class="nav-sub" onclick="goPage('storeoperation',this)"><span class="nav-sub-icon">🏪</span>Store Operations</div>
    <div class="nav-sub" onclick="goPage('controltower',this)"><span class="nav-sub-icon">🗼</span>Store Control Tower</div>
    <div class="nav-sub" onclick="goPage('operhr',this)"><span class="nav-sub-icon">👤</span>Oper HR</div>
    <div class="nav-sub" onclick="goPage('cs',this)"><span class="nav-sub-icon">🎫</span>CS</div>
    <div class="nav-sub" onclick="goPage('lpic',this)"><span class="nav-sub-icon">🔒</span>LPIC</div>`;
  const opOps=`<div class="nav-fn-sec">Operation</div>
    <div class="nav-sub" onclick="goPage('storeoperation',this)"><span class="nav-sub-icon">🏪</span>Store Operations</div>
    <div class="nav-sub" onclick="goPage('controltower',this)"><span class="nav-sub-icon">🗼</span>Store Control Tower</div>
    <div class="nav-sub" onclick="goPage('operhr',this)"><span class="nav-sub-icon">👤</span>Oper HR</div>`;
  const lpicOnly=`<div class="nav-fn-sec">Operation</div><div class="nav-sub" onclick="goPage('lpic',this)"><span class="nav-sub-icon">🔒</span>LPIC</div>`;

  const ssFull=`<div class="nav-fn-sec">Sales & Supply</div>
    <div class="nav-sub" onclick="goPage('commercial',this)"><span class="nav-sub-icon">🛍</span>Commercial</div>
    <div class="nav-sub" onclick="goPage('supplychain',this)"><span class="nav-sub-icon">📦</span>Supply Chain</div>`;
  const comOnly=`<div class="nav-fn-sec">Sales & Supply</div><div class="nav-sub" onclick="goPage('commercial',this)"><span class="nav-sub-icon">🛍</span>Commercial</div>`;
  const scOnly =`<div class="nav-fn-sec">Sales & Supply</div><div class="nav-sub" onclick="goPage('supplychain',this)"><span class="nav-sub-icon">📦</span>Supply Chain</div>`;

  const actFull=`<div class="nav-fn-sec">Activities</div>
    <div class="nav-sub" onclick="goPage('nsa',this)"><span class="nav-sub-icon">🎉</span>NSA</div>
    <div class="nav-sub" onclick="goPage('storepartnership',this)"><span class="nav-sub-icon">🤲</span>Store Partnership</div>
    <div class="nav-sub" onclick="goPage('marketing',this)"><span class="nav-sub-icon">📣</span>Marketing</div>`;
  const nsaOnly=`<div class="nav-fn-sec">Activities</div><div class="nav-sub" onclick="goPage('nsa',this)"><span class="nav-sub-icon">🎉</span>NSA</div>`;
  const spOnly =`<div class="nav-fn-sec">Activities</div><div class="nav-sub" onclick="goPage('storepartnership',this)"><span class="nav-sub-icon">🤲</span>Store Partnership</div>`;
  const mktOnly=`<div class="nav-fn-sec">Activities</div><div class="nav-sub" onclick="goPage('marketing',this)"><span class="nav-sub-icon">📣</span>Marketing</div>`;

  const bbFull=`<div class="nav-fn-sec">Backbone</div>
    <div class="nav-sub" onclick="goPage('af',this)"><span class="nav-sub-icon">💰</span>A&F</div>
    <div class="nav-sub" onclick="goPage('sp',this)"><span class="nav-sub-icon">🛒</span>S&P</div>
    <div class="nav-sub" onclick="goPage('people',this)"><span class="nav-sub-icon">🧑‍🤝‍🧑</span>People</div>
    <div class="nav-sub" onclick="goPage('legal',this)"><span class="nav-sub-icon">⚖️</span>Legal</div>`;
  const afOnly    =`<div class="nav-fn-sec">Backbone</div><div class="nav-sub" onclick="goPage('af',this)"><span class="nav-sub-icon">💰</span>A&F</div>`;
  const bbSpOnly  =`<div class="nav-fn-sec">Backbone</div><div class="nav-sub" onclick="goPage('sp',this)"><span class="nav-sub-icon">🛒</span>S&P</div>`;
  const peopleOnly=`<div class="nav-fn-sec">Backbone</div><div class="nav-sub" onclick="goPage('people',this)"><span class="nav-sub-icon">🧑‍🤝‍🧑</span>People</div>`;
  const legalOnly =`<div class="nav-fn-sec">Backbone</div><div class="nav-sub" onclick="goPage('legal',this)"><span class="nav-sub-icon">⚖️</span>Legal</div>`;

  const techFull=`<div class="nav-fn-sec">Technology</div>
    <div class="nav-sub" onclick="goPage('tech',this)"><span class="nav-sub-icon">💻</span>Tech</div>
    <div class="nav-sub" onclick="goPage('itsupport',this)"><span class="nav-sub-icon">🛠</span>IT Support</div>`;

  const isFieldOps=['rm','am','sm','asst'].includes(r);
  let fn='';
  switch(r){
    case 'md': case 'bsa': fn=expFull+opFull+ssFull+actFull+bbFull+techFull; break;
    case 'head-expansion':       fn=expOnly;    break;
    case 'head-negotiation':     fn=negOnly;    break;
    case 'head-construction':    fn=conOnly;    break;
    case 'head-operation':       fn=opFull;     break;
    case 'head-lpic':            fn=lpicOnly;   break;
    case 'head-commercial':      fn=comOnly;    break;
    case 'head-supplychain':     fn=scOnly;     break;
    case 'head-nsa':             fn=nsaOnly;    break;
    case 'head-storepartnership':fn=spOnly;     break;
    case 'head-marketing':       fn=mktOnly;    break;
    case 'head-af':              fn=afOnly;     break;
    case 'head-sp':              fn=bbSpOnly;   break;
    case 'head-people':          fn=peopleOnly; break;
    case 'head-legal':           fn=legalOnly;  break;
    case 'head-tech':            fn=techFull;   break;
    case 'rc':                   fn=opFull;     break;
    case 'rm': case 'am': case 'sm': case 'asst': fn=opOps; break;
  }
  if(isFieldOps) return me+fnsec+fn;
  return me+team+biz+(fn?fnsec+fn:'');
}

function renderSidebar(){document.getElementById('sidebar').innerHTML=buildSidebar(role);}

// ── NAVIGATION ───────────────────────────────────────
function goPage(p,el){
  page=p;
  document.querySelectorAll('.nav-item,.nav-sub').forEach(n=>n.classList.remove('active'));
  if(el)el.classList.add('active');
  renderDefault();
}

// ── PAGE META ────────────────────────────────────────
const META={
  expansion:       {icon:'🗺', title:'Site Expansion',      desc:'Pipeline of potential new sites — prospecting, scoring, and status tracking.'},
  negotiation:     {icon:'🤝', title:'Site Negotiation',     desc:'Active lease and deal negotiations. Term sheets, landlord status, and key milestones.'},
  construction:    {icon:'🏗', title:'Construction',         desc:'Active construction projects, timelines, contractor status, and risk flags.'},
  storeoperation:  {icon:'🏪', title:'Store Operations',     desc:'Day-to-day operational health across the store network.'},
  controltower:    {icon:'🗼', title:'Store Control Tower',  desc:'Real-time operational overview — key alerts, live KPIs, and urgent issues.'},
  operhr:          {icon:'👤', title:'Oper HR',              desc:'Headcount, scheduling, attendance, and operational HR issues.'},
  cs:              {icon:'🎫', title:'CS',                   desc:'Customer service tickets, resolution rates, and escalations.'},
  lpic:            {icon:'🔒', title:'LPIC',                 desc:'Loss prevention and inventory control — shrinkage, audits, and incidents.'},
  supplychain:     {icon:'📦', title:'Supply Chain',         desc:'Inbound flow, stock levels, supplier performance, and logistics.'},
  nsa:             {icon:'🎉', title:'NSA',                  desc:'New store activation — opening checklist, readiness, and launch tracking.'},
  storepartnership:{icon:'🤲', title:'Store Partnership',    desc:'Concession and store-in-store partner management.'},
  marketing:       {icon:'📣', title:'Marketing',            desc:'Campaigns, promotions, and marketing performance tracking.'},
  af:              {icon:'💰', title:'A&F',                  desc:'Accounting & Finance — P&L, budgets, cost control, and financial reporting.'},
  sp:              {icon:'🛒', title:'S&P',                  desc:'Sourcing & Procurement — vendor management, contracts, and purchasing.'},
  people:          {icon:'🧑‍🤝‍🧑',title:'People',          desc:'HR strategy, talent pipeline, compensation, and people programs.'},
  legal:           {icon:'⚖️',title:'Legal',                desc:'Legal matters, contracts, compliance, and regulatory tracking.'},
  tech:            {icon:'💻', title:'Tech',                 desc:'Technology roadmap, systems health, and IT projects.'},
  itsupport:       {icon:'🛠', title:'IT Support',           desc:'Helpdesk, device management, and IT incident tracking.'},
};

function blank(icon,title,desc){
  return `<div class="blank-page fadein">
    <div class="blank-icon">${icon}</div>
    <div class="blank-title">${title}</div>
    <div class="blank-desc">${desc}</div>
    <div class="blank-tag">Build this page</div>
  </div>`;
}

// ── RENDER ───────────────────────────────────────────
function renderDefault(){
  const pages={
    me:()=>renderMePage(),
    team:()=>renderTeamPage(),
    bizcontrol:()=>renderBizControlPage(),
    commercial:()=>renderCommercialPage(),
    sp:()=>renderSPPage(),
  };
  if(pages[page]) pages[page]();
  else{
    const m=META[page]||{icon:'📄',title:page,desc:''};
    document.getElementById('main').innerHTML=`
      <div class="ph fadein"><div><div class="ph-title">${m.title}</div></div></div>
      ${blank(m.icon,m.title,m.desc)}`;
  }
}

function renderMePage(){
  const n=new Date();
  document.getElementById('main').innerHTML=`
    <div class="ph fadein"><div>
      <div class="ph-title">Good ${n.getHours()<12?'Morning':n.getHours()<17?'Afternoon':'Evening'}</div>
      <div class="ph-sub">Your personal feed — alerts, announcements, and action items</div>
    </div></div>
    <div class="sec-blank fadein" style="min-height:80px;">📢 &nbsp; Announcements</div>
    <div class="sec-blank fadein" style="min-height:80px;">✅ &nbsp; Action Items</div>
    <div class="sec-blank fadein" style="min-height:80px;">⚡ &nbsp; Alerts</div>
    <div class="sec-blank fadein" style="min-height:80px;">🟢 &nbsp; Good News</div>`;
}

function renderTeamPage(){
  document.getElementById('main').innerHTML=`
    <div class="ph fadein"><div>
      <div class="ph-title">Team</div>
      <div class="ph-sub">People performance, org structure, headcount & HR issues</div>
    </div></div>
    <div class="tab-bar fadein">
      <button class="tab-btn active">Performance</button>
      <button class="tab-btn">Org & Structure</button>
      <button class="tab-btn">Headcount & Budget</button>
      <button class="tab-btn">People Issues</button>
    </div>
    <div class="sec-blank fadein" style="min-height:300px;">Build Team page here</div>`;
}

function renderBizControlPage(){
  const tabs=[
    {key:'tower',label:'🗼 Tower'},
    {key:'pipeline',label:'📍 Store Pipeline'},
    {key:'storehealth',label:'🏪 Store Health'},
    {key:'categoryhealth',label:'📦 Category Health'},
  ];
  const tabHtml=tabs.map(t=>`<button class="tab-btn${bcTab===t.key?' active':''}" onclick="bcGoTab('${t.key}')">${t.label}</button>`).join('');
  let content='';
  if(bcTab==='tower') content=renderBizControlTower();
  else if(bcTab==='pipeline') content=renderBizControlPipeline();
  else if(bcTab==='storehealth') content=renderBizControlStoreHealth();
  else if(bcTab==='categoryhealth') content=renderBizControlCategoryHealth();
  document.getElementById('main').innerHTML=`
    <div class="ph fadein"><div>
      <div class="ph-title">Business Control</div>
      <div class="ph-sub">Company-wide performance overview — live mock data</div>
    </div></div>
    <div class="tab-bar fadein">${tabHtml}</div>
    ${content}`;
}

// ── BUSINESS CONTROL ─────────────────────────────────
let bcTab='tower';
function bcGoTab(t){bcTab=t;renderBizControlPage();}

const BC_STORES=[

  {id:'BKK-002',name:'Siam Paragon',region:'BKK Central',rm:'Piyaporn S.',am:'Nat T.',sm:'Aom W.',rev:5310,revT:5000,gm:39.1,gmT:37,nps:76,npsT:68,shrink:0.28,shrinkT:0.4,comp:105.8,staff:97,issues:0,status:'green'},

function statusBadge(s){
  const map={green:['var(--green)','var(--gbg)','var(--gmid)','●'],yellow:['var(--yellow)','var(--ybg)','var(--ymid)','●'],red:['var(--red)','var(--rbg)','var(--rmid)','●']};
  const [c,bg,border,dot]=map[s]||map.green;
  return `<span style="display:inline-flex;align-items:center;gap:4px;background:${bg};border:1px solid ${border};border-radius:12px;padding:2px 8px;font-size:10px;font-weight:700;color:${c};">${dot} ${s.toUpperCase()}</span>`;
}
function delta(v,t,invert=false){
  const d=v-t,pct=((d/t)*100).toFixed(1);
  const up=invert?(d<0):(d>0);
  const col=up?'var(--green)':'var(--red)';
  const arrow=up?'▲':'▼';
  return `<span style="font-size:10px;color:${col};font-weight:700;">${arrow} ${Math.abs(pct)}%</span>`;
}
function bar(pct,col='var(--blue)'){
  const w=Math.min(100,Math.max(0,pct));
  return `<div style="width:100%;height:5px;background:var(--s3);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${w}%;background:${col};border-radius:3px;transition:width .4s;"></div></div>`;
}
function phasePill(p){
  const map={Prospecting:['#7c3aed','#f5f3ff'],Negotiation:['#c67e00','#fffbeb'],'LOI Signed':['#0891b2','#ecfeff'],Construction:['#ea580c','#fff7ed'],'Fit-Out':['#16a34a','#f0fdf4']};
  const [c,bg]=map[p]||['#6b7280','#f3f4f6'];
  return `<span style="background:${bg};color:${c};border-radius:12px;padding:2px 8px;font-size:10px;font-weight:700;">${p}</span>`;
}
function riskPill(r){
  const map={low:['var(--green)','var(--gbg)'],medium:['var(--yellow)','var(--ybg)'],high:['var(--red)','var(--rbg)']};
  const [c,bg]=map[r]||['var(--t3)','var(--s2)'];
  return `<span style="background:${bg};color:${c};border-radius:12px;padding:2px 8px;font-size:10px;font-weight:700;">${r.toUpperCase()}</span>`;
}

function renderBizControlStoreHealth(){
  const sorted=[...BC_STORES].sort((a,b)=>b.comp-a.comp);

  const metricDef=[
    {key:'rev',label:'Revenue',fmt:v=>`฿${v.toLocaleString()}k`,t:(s)=>s.rev>=s.revT,bar:true,max:6000},
    {key:'comp',label:'Comp %',fmt:v=>`${v}%`,t:(s)=>s.comp>=100,bar:true,max:120},
    {key:'gm',label:'GM%',fmt:v=>`${v}%`,t:(s)=>s.gm>=s.gmT,bar:true,max:45},
    {key:'nps',label:'NPS',fmt:v=>`${v}`,t:(s)=>s.nps>=s.npsT,bar:true,max:100},
    {key:'shrink',label:'Shrink%',fmt:v=>`${v}%`,t:(s)=>s.shrink<=s.shrinkT,bar:true,max:1.0,invert:true},
    {key:'staff',label:'Staff%',fmt:v=>`${v}%`,t:(s)=>s.staff>=90,bar:true,max:100},
  ];

  const cards=sorted.map(s=>{
    const scoreItems=metricDef.map(m=>{
      const ok=m.t(s);
      const val=s[m.key];
      const pct=m.invert?(1-(val/m.max))*100:(val/m.max)*100;
      const barCol=ok?'var(--green)':'var(--red)';
      return `<div>
        <div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px;">
          <span style="color:var(--t3);font-weight:600;">${m.label}</span>
          <span style="font-weight:700;color:${ok?'var(--green)':'var(--red)'};">${m.fmt(val)}</span>
        </div>
        ${bar(pct,barCol)}
      </div>`;}).join('');

    const passCount=metricDef.filter(m=>m.t(s)).length;
    const score=Math.round((passCount/metricDef.length)*100);
    const scorecol=score>=80?'var(--green)':score>=60?'var(--yellow)':'var(--red)';

    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;transition:box-shadow .15s;" onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,.08)'" onmouseout="this.style.boxShadow=''">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;">
        <div>
          <div style="font-weight:800;font-size:13px;">${s.name}</div>
          <div style="font-size:10px;color:var(--t3);margin-top:2px;">${s.id} · ${s.region}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:20px;font-weight:800;color:${scorecol};">${score}</div>
          <div style="font-size:9px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">Health Score</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">${scoreItems}</div>
      ${s.issues>0?`<div style="margin-top:10px;background:var(--rbg);border:1px solid var(--rmid);border-radius:7px;padding:6px 10px;font-size:11px;color:var(--red);font-weight:600;">⚠️ ${s.issues} open issue${s.issues>1?'s':''}</div>`:''}
    </div>`;
  }).join('');

  return `
  <div class="fadein" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
    ${[
      {l:'All Green',v:BC_STORES.filter(s=>s.status==='green').length,c:'var(--green)',bg:'var(--gbg)'},
      {l:'Watch',v:BC_STORES.filter(s=>s.status==='yellow').length,c:'var(--yellow)',bg:'var(--ybg)'},
      {l:'Critical',v:BC_STORES.filter(s=>s.status==='red').length,c:'var(--red)',bg:'var(--rbg)'},
      {l:'Open Issues',v:BC_STORES.reduce((a,s)=>a+s.issues,0),c:'var(--red)',bg:'var(--rbg)'},
    ].map(k=>`<div style="background:${k.bg};border:1px solid var(--border);border-radius:10px;padding:12px 16px;text-align:center;">
      <div style="font-size:28px;font-weight:800;color:${k.c};">${k.v}</div>

    </div>`).join('')}
  </div>
  <div class="fadein" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;">${cards}</div>`;
}

function renderBizControlCategoryHealth(){
  const rows=BC_CATEGORIES.map(c=>{
    const revOk=c.rev>=c.revT;
    const mOk=c.margin>=c.marginT;
    const gOk=c.growth>=0;
    const compOk=c.comp>=100;
    const flagBadge=c.flag?`<span style="background:var(--ybg);color:var(--yellow);border-radius:10px;padding:1px 7px;font-size:9px;font-weight:700;text-transform:uppercase;">⚠ ${c.flag}</span>`:'';
    return `<tr style="border-bottom:1px solid var(--border);" onmouseover="this.style.background='var(--s2)'" onmouseout="this.style.background=''">
      <td style="padding:10px 12px;font-weight:700;font-size:12px;">${c.name} ${flagBadge}</td>
      <td style="padding:10px 12px;">
        <div style="font-weight:700;font-size:12px;color:${revOk?'var(--green)':'var(--red)'};">฿${c.rev.toLocaleString()}k</div>
        <div style="font-size:10px;color:var(--t3);">T: ฿${c.revT.toLocaleString()}k</div>
      </td>
      <td style="padding:10px 12px;">${delta(c.rev,c.revT)}</td>
      <td style="padding:10px 12px;font-weight:700;color:${mOk?'var(--green)':'var(--red)'};">${c.margin}%<span style="font-size:10px;color:var(--t3);font-weight:400;"> / T:${c.marginT}%</span></td>
      <td style="padding:10px 12px;font-weight:700;color:${gOk?'var(--green)':'var(--red)'};">${c.growth>0?'+':''}${c.growth}%</td>
      <td style="padding:10px 12px;">
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="flex:1;height:5px;background:var(--s3);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${Math.min(c.rangeComp,100)}%;background:${c.rangeComp>=90?'var(--green)':'var(--yellow)'};border-radius:3px;"></div></div>
          <span style="font-size:11px;font-weight:700;color:${c.rangeComp>=90?'var(--green)':'var(--yellow)'};">${c.rangeComp}%</span>
        </div>
      </td>
      <td style="padding:10px 12px;font-size:11px;color:${c.oos<=2?'var(--green)':'var(--red)'};">${c.oos}%</td>
      <td style="padding:10px 12px;font-size:11px;color:var(--t2);">${c.top}<br><span style="color:var(--t3);">฿${c.topRev.toLocaleString()}k</span></td>
    </tr>`;}).join('');

  const totalRev=BC_CATEGORIES.reduce((a,c)=>a+c.rev,0);
  const totalRevT=BC_CATEGORIES.reduce((a,c)=>a+c.revT,0);
  const avgMargin=(BC_CATEGORIES.reduce((a,c)=>a+c.margin,0)/BC_CATEGORIES.length).toFixed(1);
  const avgOos=(BC_CATEGORIES.reduce((a,c)=>a+c.oos,0)/BC_CATEGORIES.length).toFixed(1);

  return `
  <div class="fadein" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
    ${[
      {l:'Total Revenue',v:`฿${(totalRev/1000).toFixed(2)}M`,sub:`T: ฿${(totalRevT/1000).toFixed(2)}M`,ok:totalRev>=totalRevT},
      {l:'Comp vs Target',v:`${((totalRev/totalRevT)*100).toFixed(1)}%`,sub:'Revenue achievement',ok:totalRev>=totalRevT},
      {l:'Avg Margin',v:`${avgMargin}%`,sub:'Wtd avg across categories',ok:parseFloat(avgMargin)>=37},
      {l:'Avg OOS Rate',v:`${avgOos}%`,sub:'Target < 2.0%',ok:parseFloat(avgOos)<2},
    ].map(k=>`<div style="background:${k.ok?'var(--gbg)':'var(--rbg)'};border:1px solid var(--border);border-radius:10px;padding:12px 16px;">
      <div style="font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);margin-bottom:4px;">${k.l}</div>
      <div style="font-size:22px;font-weight:800;color:${k.ok?'var(--green)':'var(--red)'};">${k.v}</div>
      <div style="font-size:11px;color:var(--t3);margin-top:3px;">${k.sub}</div>
    </div>`).join('')}
  </div>

  <div class="fadein" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;">
    <div style="padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;">Category Performance</div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;">
        <thead><tr style="background:var(--s2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);">
          <th style="padding:10px 12px;text-align:left;">Category</th>
          <th style="padding:10px 12px;text-align:left;">Revenue</th>
          <th style="padding:10px 12px;text-align:left;">vs T</th>
          <th style="padding:10px 12px;text-align:left;">Margin</th>
          <th style="padding:10px 12px;text-align:left;">Growth</th>
          <th style="padding:10px 12px;text-align:left;min-width:120px;">Range Comp</th>
          <th style="padding:10px 12px;text-align:left;">OOS%</th>
          <th style="padding:10px 12px;text-align:left;">Top SKU</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

  return f[gc]||gc;

function kfGetSqm(s){const n=parseInt(String(s).replace(/[^0-9]/g,''));return n===200?200:300;}
function kfIsTransport(gc){return KF_TRANSPORT_CODES.has(gc);}
function kfPrefix(gc){return gc.replace(/(200|300)$/,'');}
function kfIsStandard(gc,sqm){if(KF_TRANSPORT_CODES.has(gc))return false;return KF_MASTER_PREFIXES.includes(kfPrefix(gc));}

function kfCoverageCalc(openedGCs,sqm){
  const required=sqm===200?KF_REQUIRED_PREFIXES_200:KF_REQUIRED_PREFIXES_300;
  const pfx=new Set(openedGCs.map(kfPrefix));
  const covered=required.filter(p=>pfx.has(p));
  const missing=required.filter(p=>!pfx.has(p));
  return{required,covered,missing,pct:Math.round((covered.length/required.length)*100)};
}

function kfParseData(raw){
  const m={};
  raw.forEach(t=>{
    const code=t['รหัสร้าน']||'',name=t['ชื่อร้าน (Store Name)']||'',sqmStr=t['ขนาดร้านพื้นที่ขาย']||'';
    if(!m[code])m[code]={code,name,sqm:kfGetSqm(sqmStr),sqmStr,targetMonth:t['เป้าเดือนเปิด']||'',tickets:[]};
    m[code].tickets.push({
      ticketNo:t['Ticket No']||'',date:t['Request Date']||'',
      totalVendor:parseFloat(t['Total Vendor Price'])||0,
      totalBudget:parseFloat(t['Total Budget'])||0,
      standard:Array.isArray(t['Construction Table'])?t['Construction Table']:[],
      extra:Array.isArray(t['Construction Table - งานเพิ่ม'])?t['Construction Table - งานเพิ่ม']:[],
    });
  });
  return Object.values(m).sort((a,b)=>a.targetMonth.localeCompare(b.targetMonth,'th')||a.name.localeCompare(b.name,'th'));
}

function kfApprovalBadge(af,sp){
  if(af&&sp)  return`<span style="background:var(--gbg);border:1px solid var(--gmid);border-radius:10px;padding:1px 8px;font-size:10px;font-weight:700;color:var(--green);">AF ok S&amp;P ok</span>`;
  if(af&&!sp) return`<span style="background:var(--bbg);border:1px solid var(--bmid);border-radius:10px;padding:1px 8px;font-size:10px;font-weight:700;color:var(--blue);">AF ok S&amp;P wait</span>`;
  if(!af&&sp) return`<span style="background:var(--bbg);border:1px solid var(--bmid);border-radius:10px;padding:1px 8px;font-size:10px;font-weight:700;color:var(--blue);">AF wait S&amp;P ok</span>`;
  return`<span style="background:var(--ybg);border:1px solid var(--ymid);border-radius:10px;padding:1px 8px;font-size:10px;font-weight:700;color:var(--yellow);">Pending</span>`;
}

    const gc=r['Group Code']||'';
    if(!openedMap[gc])openedMap[gc]={gc,rows:[],vendor:0,budget:0,afOK:true,spOK:true};

function fmtTHB(v){
  if(v>=1000000) return `฿${(v/1000000).toFixed(2)}M`;

  return `฿${v.toLocaleString()}`;
}

const SP_API_URL='https://script.google.com/macros/s/AKfycbxYpBfqN-LHJQkNek9BiwSxQuGOOrPJbF3UbshUUSY_6KxIeSz3ZA9T8QttihZ9qbGa/exec';
let spSubData=null;
let spSubFilter={bu:'ALL',group:'ALL',status:'ALL',search:''};

async function fetchSubData(){
  if(spSubData) return spSubData;
  const res=await fetch(SP_API_URL);
  const payload=await res.json();

  // Support both old (array) and new (object with master+groupCodes) format
  const masterRaw=Array.isArray(payload)?payload:(payload.master||[]);
  const gcRaw=Array.isArray(payload)?[]:(payload.groupCodes||[]);

  // Build Group → GroupCode map from Revise Cafe 2
  // Revise Cafe 2 cols: col0=no, col1=Group, col2=GroupCode(200sqm), col7=GroupCode(300sqm)
  const grpCodeMap={};
  gcRaw.slice(1).forEach(r=>{
    const grp=String(r[1]||'').trim();
    const code200=String(r[2]||'').trim();
    const code300=String(r[7]||'').trim();
    if(grp) grpCodeMap[grp]={code200,code300};
  });

  const headers=masterRaw[0]||[];
  const rows=masterRaw.slice(1).filter(r=>r&&r.some(c=>c!==''));

  // fuzzy match
    const nm=s=>String(s).replace(/[\r\n\t]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
  const idxE=name=>headers.findIndex(h=>nm(h)===nm(name));
  const idxC=kw=>headers.findIndex(h=>nm(h).includes(nm(kw)));
  const iNo=idxE('No'),iBU=idxE('BU'),
        iSup=idxC('supplier'),iDet=idxE('Details'),
        iPriceUnit=headers.findIndex(h=>nm(h).startsWith('price/qty')||nm(h)==='price/qty'),
        iQty200=idxC('qty (200'),iPrc200=idxC('price (200'),
        iQty300=idxC('qty (300'),iPrc300=idxC('price (300'),
        iGrp=idxE('Group'),
        iCost200=headers.findIndex(h=>nm(h).includes('cost')&&nm(h).includes('group')&&nm(h).includes('200')),
        iCost300=headers.findIndex(h=>nm(h).includes('cost')&&nm(h).includes('group')&&nm(h).includes('300')),
        iStatus=idxE('Status'),iNote=idxC('หมายเหตุ'),iAction=idxC('action');
  spSubData=rows.map((r,i)=>{
    const grp=String(r[iGrp]||'').trim();
    const gc=grpCodeMap[grp]||{};
    return {
      no:r[iNo]||i+1,
      bu:String(r[iBU]||'').trim(),
      supplier:String(r[iSup]||'').trim(),
      details:String(r[iDet]||'').trim(),
      priceUnit:r[iPriceUnit],
      qty200:r[iQty200],price200:r[iPrc200],
      qty300:r[iQty300],price300:r[iPrc300],
      group:grp,
      groupCode200:gc.code200||'',
      groupCode300:gc.code300||'',
      cost200:r[iCost200],cost300:r[iCost300],
      status:String(r[iStatus]||'').trim(),
      note:String(r[iNote]||'').trim(),
      action:String(r[iAction]||'').trim(),
    };
  });
  return spSubData;
}

function spSubBadge(s){
  const v=String(s||'').toLowerCase();
  if(v.includes('on process')||v.includes('progress')) return `<span style="background:var(--bbg);border:1px solid var(--bmid);border-radius:12px;padding:2px 9px;font-size:10px;font-weight:700;color:var(--blue);">⚙ On Process</span>`;
  if(v.includes('done')) return `<span style="background:var(--gbg);border:1px solid var(--gmid);border-radius:12px;padding:2px 9px;font-size:10px;font-weight:700;color:var(--green);">✓ Done</span>`;
  if(v.includes('compare')||v.includes('scope')) return `<span style="background:#f5f3ff;border:1px solid #ddd6fe;border-radius:12px;padding:2px 9px;font-size:10px;font-weight:700;color:#7c3aed;">🔍 Compare</span>`;
  if(v.includes('clarify')) return `<span style="background:var(--ybg);border:1px solid var(--ymid);border-radius:12px;padding:2px 9px;font-size:10px;font-weight:700;color:var(--yellow);">💬 Clarify</span>`;
  return `<span style="background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:2px 9px;font-size:10px;font-weight:700;color:var(--t3);">— Pending</span>`;
}

function fmtNum(v){
  const n=parseFloat(String(v).replace(/,/g,''));
  if(isNaN(n)||n===0) return '—';
  // แสดงราคาเต็ม พร้อม comma และทศนิยม 2 ตำแหน่ง
  return `฿${n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
}
function fmtNumShort(v){
  // ใช้เฉพาะ Summary cards
  const n=parseFloat(String(v).replace(/,/g,''));
  if(isNaN(n)||n===0) return '—';
  if(n>=1000000) return `฿${(n/1000000).toFixed(2)}M`;
  if(n>=1000) return `฿${(n/1000).toFixed(0)}K`;
  return `฿${n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
}

let spSubSelectedGroup=null;
let spSubSqm=200;

async function renderSPSubcontractorTab(){
  document.getElementById('sub-content').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:center;min-height:280px;gap:12px;color:var(--t3);font-size:13px;">
      <div style="width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;"></div>
      กำลังโหลดข้อมูลจาก Google Sheet...
    </div><style>@keyframes spin{to{transform:rotate(360deg);}}</style>`;
  try{
    const data=await fetchSubData();
    const sqm=spSubSqm;

    // Build group map
    const grpMap={};
    data.forEach(r=>{
      if(!r.group) return;
      if(!grpMap[r.group]) grpMap[r.group]={name:r.group,code200:r.groupCode200||'',code300:r.groupCode300||'',suppliers:new Set(),items:[],c200:0,c300:0};
      grpMap[r.group].suppliers.add(r.supplier);
      grpMap[r.group].items.push(r);
      const v200=parseFloat(String(r.cost200).replace(/,/g,''))||0;
      const v300=parseFloat(String(r.cost300).replace(/,/g,''))||0;
      if(v200>0) grpMap[r.group].c200=v200;
      if(v300>0) grpMap[r.group].c300=v300;
      if(r.groupCode200) grpMap[r.group].code200=r.groupCode200;
      if(r.groupCode300) grpMap[r.group].code300=r.groupCode300;
    });

    const grpList=Object.values(grpMap).sort((a,b)=>{
      const va=sqm===200?a.c200:a.c300;
      const vb=sqm===200?b.c200:b.c300;
      return vb-va;
    });

    // Only show groups that have data for selected sqm
    const visibleGrps=grpList.filter(g=>sqm===200?g.c200>0:g.c300>0);
    const tot=visibleGrps.reduce((a,g)=>a+(sqm===200?g.c200:g.c300),0);
    const suppliers=[...new Set(data.map(r=>r.supplier).filter(Boolean))];
    if(!spSubSelectedGroup||!grpMap[spSubSelectedGroup]) spSubSelectedGroup=visibleGrps[0]?.name||null;

    // Summary cards
    const summaryCards=[
      {l:'Groups ('+(sqm===200?'200':'300')+' sqm)',v:visibleGrps.length,sub:'ที่มีราคา',c:'var(--text)',bg:'var(--surface)'},
      {l:'ราคารวมต่อสาขา',v:fmtNumShort(tot),sub:sqm===200?'200 sqm':'300 sqm',c:'var(--blue)',bg:'var(--bbg)'},
      {l:'Line Items',v:data.length,sub:'รายการทั้งหมด',c:'var(--text)',bg:'var(--surface)'},
      {l:'Suppliers',v:suppliers.length,sub:'ผู้รับเหมารอง',c:'var(--text)',bg:'var(--surface)'},
    ].map(k=>`<div style="background:${k.bg};border:1px solid var(--border);border-radius:10px;padding:12px 16px;">
      <div style="font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);margin-bottom:4px;">${k.l}</div>
      <div style="font-size:22px;font-weight:800;color:${k.c};">${k.v}</div>
      <div style="font-size:10px;color:var(--t3);margin-top:2px;">${k.sub}</div>
    </div>`).join('');

    // Group cards
    const groupCards=visibleGrps.map(g=>{
      const isActive=g.name===spSubSelectedGroup;
      const code=sqm===200?g.code200:g.code300;
      const price=sqm===200?g.c200:g.c300;
      const supNames=[...g.suppliers].filter(Boolean).join(', ');
      // items relevant to this sqm
      const itemCount=g.items.filter(r=>sqm===200?(r.qty200&&r.qty200!=0):(r.qty300&&r.qty300!=0)).length||g.items.length;
      return `<div onclick="spSubSelectedGroup='${g.name.replace(/['"]/g,'')}';renderSPSubcontractorTab();"
        style="background:${isActive?'var(--bbg)':'var(--surface)'};border:1px solid ${isActive?'var(--bmid)':'var(--border)'};border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .12s;"
        onmouseover="if('${g.name.replace(/['"]/g,'')}'\!==spSubSelectedGroup)this.style.background='var(--s2)'"
        onmouseout="if('${g.name.replace(/['"]/g,'')}'\!==spSubSelectedGroup)this.style.background='var(--surface)'">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
          <span style="font-size:9px;font-weight:800;background:${isActive?'var(--blue)':'var(--s3)'};color:${isActive?'#fff':'var(--t2)'};border-radius:5px;padding:2px 7px;font-family:'JetBrains Mono',monospace;white-space:nowrap;">${code||'—'}</span>
        </div>
        <div style="font-weight:700;font-size:12px;color:${isActive?'var(--blue)':'var(--text)'};margin-bottom:3px;line-height:1.3;">${g.name}</div>
        <div style="font-size:10px;color:var(--t3);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${supNames}">${supNames||'—'}</div>
        <div style="font-size:15px;font-weight:800;color:${isActive?'var(--blue)':'var(--text)'};">${fmtNum(price)}</div>
        <div style="font-size:10px;color:var(--t3);margin-top:4px;">${itemCount} รายการ</div>
      </div>`;
    }).join('');

    // Detail table
    let detailHtml='';
    if(spSubSelectedGroup&&grpMap[spSubSelectedGroup]){
      const sel=grpMap[spSubSelectedGroup];
      const code=sqm===200?sel.code200:sel.code300;
      const price=sqm===200?sel.c200:sel.c300;
      // show all items, grey out ones with no qty for this sqm
      const detailRows=sel.items.map(r=>{
        const hasData=sqm===200?(r.qty200&&r.qty200!=0&&r.qty200!='0'):(r.qty300&&r.qty300!=0&&r.qty300!='0');
        const op=hasData?'1':'0.4';
        const qty=sqm===200?(r.qty200||'—'):(r.qty300||'—');
        const prcTotal=sqm===200?fmtNum(r.price200):fmtNum(r.price300);
        const noteAction=[r.note,r.action].filter(x=>x&&x.trim()&&x!=='—').join(' · ')||'—';
        return `<tr style="border-bottom:1px solid var(--border);opacity:${op};" onmouseover="this.style.background='var(--s2)'" onmouseout="this.style.background=''">
          <td style="padding:8px 12px;font-size:10px;color:var(--t4);font-family:'JetBrains Mono',monospace;">${r.no}</td>
          <td style="padding:8px 12px;font-size:11px;color:var(--t2);">${r.details||'—'}</td>
          <td style="padding:8px 12px;"><span style="background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:2px 7px;font-size:10px;font-weight:700;">${r.bu||'—'}</span></td>
          <td style="padding:8px 12px;font-size:11px;font-weight:600;white-space:nowrap;">${r.supplier||'—'}</td>
          <td style="padding:8px 12px;text-align:right;font-size:11px;white-space:nowrap;">${fmtNum(r.priceUnit)}</td>
          <td style="padding:8px 12px;text-align:right;font-size:11px;white-space:nowrap;">${qty}</td>
          <td style="padding:8px 12px;text-align:right;font-size:12px;font-weight:700;white-space:nowrap;">${prcTotal}</td>
          <td style="padding:8px 12px;font-size:10px;color:var(--t3);max-width:160px;">${noteAction}</td>
        </tr>`;
      }).join('');
      detailHtml=`
        <div class="fadein" style="background:var(--surface);border:1px solid var(--bmid);border-radius:12px;overflow:hidden;">
          <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bbg);">
            <span style="font-size:11px;font-weight:800;background:var(--blue);color:#fff;border-radius:6px;padding:2px 10px;font-family:'JetBrains Mono',monospace;">${code||'—'}</span>
            <div style="font-weight:800;font-size:13px;color:var(--blue);">${sel.name}</div>
            <div style="font-size:11px;color:var(--t3);">${sel.items.length} รายการ</div>
            <div style="flex:1;"></div>
            <div style="font-size:13px;font-weight:800;color:var(--blue);">${fmtNum(price)}</div>
            <div style="font-size:11px;color:var(--t3);">${sqm} sqm</div>
          </div>
          <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;">
              <thead><tr style="background:var(--s2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);">
                <th style="padding:8px 12px;text-align:left;">#</th>
                <th style="padding:8px 12px;text-align:left;">รายละเอียด</th>
                <th style="padding:8px 12px;text-align:left;">BU</th>
                <th style="padding:8px 12px;text-align:left;">Supplier</th>
                <th style="padding:8px 12px;text-align:right;">ราคา/หน่วย</th>
                <th style="padding:8px 12px;text-align:right;">Qty</th>
                <th style="padding:8px 12px;text-align:right;">ราคารวม</th>
                <th style="padding:8px 12px;text-align:left;">หมายเหตุ / Action</th>
              </tr></thead>
              <tbody>${detailRows}</tbody>
            </table>
          </div>
        </div>`;
    }

    document.getElementById('sub-content').innerHTML=`
      <div class="fadein" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div style="font-weight:700;font-size:13px;">Master ผู้รับเหมารอง</div>
        <div style="display:flex;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;">
          <button onclick="spSubSqm=200;spSubSelectedGroup=null;renderSPSubcontractorTab()" style="padding:5px 16px;border-radius:6px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;background:${sqm===200?'var(--surface)':'transparent'};color:${sqm===200?'var(--blue)':'var(--t3)'};">200 sqm</button>
          <button onclick="spSubSqm=300;spSubSelectedGroup=null;renderSPSubcontractorTab()" style="padding:5px 16px;border-radius:6px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;background:${sqm===300?'var(--surface)':'transparent'};color:${sqm===300?'var(--blue)':'var(--t3)'};">300 sqm</button>
        </div>
        <div style="flex:1;"></div>
        <span style="font-size:11px;color:var(--t3);">คลิก Group เพื่อดู Detail</span>
        <button onclick="spSubData=null;spSubSelectedGroup=null;renderSPSubcontractorTab()" style="background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;">↻ Refresh</button>
      </div>
      <div class="fadein" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">${summaryCards}</div>
      <div class="fadein" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;">
        <div style="padding:12px 16px;border-bottom:1px solid var(--border);">
          <div style="font-size:12px;font-weight:700;">Groups — ${sqm} sqm <span style="font-size:11px;font-weight:400;color:var(--t3);">(${visibleGrps.length} groups · รวม ${fmtNumShort(tot)})</span></div>
        </div>
        <div style="padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;">${groupCards}</div>
      </div>
      ${detailHtml}`;
  }catch(err){
    document.getElementById('sub-content').innerHTML=`
      <div style="background:var(--rbg);border:1px solid var(--rmid);border-radius:12px;padding:32px;text-align:center;">
        <div style="font-size:28px;margin-bottom:8px;">⚠️</div>
        <div style="font-weight:700;color:var(--red);margin-bottom:4px;">โหลดข้อมูลไม่สำเร็จ</div>
        <div style="font-size:11px;color:var(--t3);margin-bottom:12px;">${err.message}</div>
        <button onclick="spSubData=null;renderSPSubcontractorTab()" style="background:var(--red);color:#fff;border:none;border-radius:7px;padding:6px 16px;font-size:11px;font-weight:700;cursor:pointer;">↻ ลองใหม่</button>
      </div>`;
  }
}


function renderSPPage(){
  const isBU=!['md','bsa','head-sp'].includes(role);
  const tabs=isBU?[
    {key:'sourcing',label:'🔍 Spec & Price Tracker'},
    {key:'maintenance',label:'🔧 งานซ่อมสาขา'},
    {key:'subcontractor',label:'🏗 รายการผู้รับเหมารอง'},
    {key:'kissflow',label:'📋 PR Coverage รายสาขา'},
  ]:[
    {key:'overview',   label:'📊 Overview'},
    {key:'sourcing',   label:'🔍 Sourcing'},
    {key:'procurement',label:'💰 Procurement'},
    {key:'maintenance',label:'🔧 Maintenance'},
    {key:'subcontractor',label:'🏗 ผู้รับเหมารอง'},
    {key:'kissflow',   label:'📋 PR Coverage'},
  ];
  if(isBU&&!['sourcing','maintenance','subcontractor','kissflow'].includes(spTab)) spTab='sourcing';
  const tabHtml=tabs.map(t=>`<button class="tab-btn${spTab===t.key?' active':''}" onclick="spGoTab('${t.key}')">${t.label}</button>`).join('');

  if(spTab==='subcontractor'){
    document.getElementById('main').innerHTML=`
      <div class="ph fadein"><div>
        <div class="ph-title">Sourcing & Procurement</div>
        <div class="ph-sub">S&P Dashboard — รายการผู้รับเหมารองทั้งหมด</div>
      </div></div>
      <div class="tab-bar fadein">${tabHtml}</div>
      <div id="sub-content"></div>`;
    renderSPSubcontractorTab();
    return;
  }

  let content='';
  if(spTab==='overview')      content=renderSPOverview();
  else if(spTab==='sourcing')     content=renderSPSourcingTab();
  else if(spTab==='procurement')  content=renderSPProcurementTab();
  else if(spTab==='maintenance')  content=renderSPMaintenanceTab();
  else if(spTab==='kissflow'){
    content=renderSPKissflowTab();
    document.getElementById('main').innerHTML=`
      <div class="ph fadein"><div>
        <div class="ph-title">Sourcing & Procurement</div>
        <div class="ph-sub">PR Coverage รายสาขา — Standard Groups · งานเพิ่ม (Mock Data · เชื่อม Kissflow ทีหลัง)</div>
      </div></div>
      <div class="tab-bar fadein">${tabHtml}</div>
      ${content}`;
    if(kfSelectedStore) setTimeout(()=>kfRenderStoreDetail(kfSelectedStore),50);
    return;
  }

  document.getElementById('main').innerHTML=`
    <div class="ph fadein"><div>
      <div class="ph-title">Sourcing & Procurement</div>
      <div class="ph-sub">${isBU?'BU View — Spec & Price Status · งานซ่อมสาขา · ผู้รับเหมารอง':'S&P Dashboard — Sourcing · Procurement · Maintenance · ผู้รับเหมารอง'}</div>
    </div></div>
    <div class="tab-bar fadein">${tabHtml}</div>
    ${content}`;
}

let cmPage='overview';
const CM_TABS=[
  {key:'overview',    label:'📊 Sales Performance'},
  {key:'sku',         label:'⚡ SKU Daily Pulse'},
  {key:'mix',         label:'📈 Sales Mix'},
  {key:'promotions',  label:'🎯 Promotions'},
  {key:'newproduct',  label:'🆕 New Product'},
  {key:'underperform',label:'⚠️ Underperforming'},
  {key:'clearance',   label:'🧹 Clearance'},
  {key:'srd',         label:'📐 SRD'},
];
const CM_DESC={
  overview:'Overall sales performance — revenue, margin, basket size, and store-level trends.',
  sku:'Daily SKU-level pulse — which products need attention today.',
  mix:'Sales mix by category, format, and channel.',
  promotions:'Active promotions — performance, uplift, and compliance.',
  newproduct:'New product tracking — ranging, availability, and early sales performance.',
  underperform:'Underperforming SKUs and categories requiring review or action.',
  clearance:'Clearance tracker — aged stock, markdown depth, and sell-through rates.',
  srd:'Space, range & display — planogram compliance and range reviews.',
};
function cmGoPage(p){cmPage=p;renderCommercialPage();}
function renderCommercialPage(){
  const tabs=CM_TABS.map(t=>`<button class="tab-btn${cmPage===t.key?' active':''}" onclick="cmGoPage('${t.key}')" style="font-size:11px;">${t.label}</button>`).join('');
  const m=CM_TABS.find(t=>t.key===cmPage)||CM_TABS[0];
  document.getElementById('main').innerHTML=`
    <div class="ph fadein"><div><div class="ph-title">Commercial</div></div></div>
    <div class="tab-bar fadein">${tabs}</div>
    ${blank(m.label.split(' ')[0],m.label.split(' ').slice(1).join(' '),CM_DESC[cmPage]||'')}`;
}

window.onload=function(){startClock();renderSidebar();renderDefault();};
