<!-- CJX Platform — Team | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">Team</div>
    <div class="ph-sub">People performance, org structure, headcount & HR issues</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_team('tp_team_0',this)">Performance</button>
  <button class="tab-btn" onclick="swtab_team('tp_team_1',this)">Org & Structure</button>
  <button class="tab-btn" onclick="swtab_team('tp_team_2',this)">Headcount & Budget</button>
  <button class="tab-btn" onclick="swtab_team('tp_team_3',this)">People Issues</button>
</div>
<div id="tp_team_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Performance</div>
</div>
<div id="tp_team_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Org & Structure</div>
</div>
<div id="tp_team_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Headcount & Budget</div>
</div>
<div id="tp_team_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: People Issues</div>
</div>
<script>
function swtab_team(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
