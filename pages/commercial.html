<div class="ph fadein">
  <div>
    <div class="ph-title">Commercial</div>
    <div class="ph-sub">Sales performance, SKU health, and category management</div>
  </div>
</div>
<div class="tab-bar fadein">

  <button class="tab-btn" onclick="swtab_commercial('tp_commercial_1',this)">⚡ SKU Daily Pulse</button>

  <button class="tab-btn" onclick="swtab_commercial('tp_commercial_3',this)">🎯 Promotions</button>
  <button class="tab-btn" onclick="swtab_commercial('tp_commercial_4',this)">🆕 New Product</button>
  <button class="tab-btn" onclick="swtab_commercial('tp_commercial_5',this)">⚠️ Underperforming</button>
  <button class="tab-btn" onclick="swtab_commercial('tp_commercial_6',this)">🧹 Clearance</button>
  <button class="tab-btn" onclick="swtab_commercial('tp_commercial_7',this)">📐 SRD</button>
</div>
<div id="tp_commercial_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: 📊 Sales Performance</div>
</div>
<div id="tp_commercial_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: ⚡ SKU Daily Pulse</div>
</div>
<div id="tp_commercial_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: 📈 Sales Mix</div>

<div id="tp_commercial_3" class="tab-pane fadein" style="display:none;">

</div>
<div id="tp_commercial_4" class="tab-pane fadein" style="display:none;">

</div>
<div id="tp_commercial_5" class="tab-pane fadein" style="display:none;">

<div id="tp_commercial_6" class="tab-pane fadein" style="display:none;">

<div id="tp_commercial_7" class="tab-pane fadein" style="display:none;">

</div>
<script>
function swtab_commercial(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
