<!-- CJX Platform — Business Control | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">Business Control</div>
    <div class="ph-sub">Company-wide performance overview</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_biz_control('tp_biz_control_0',this)">Tower</button>
  <button class="tab-btn" onclick="swtab_biz_control('tp_biz_control_1',this)">Store Pipeline</button>
  <button class="tab-btn" onclick="swtab_biz_control('tp_biz_control_2',this)">Store Health</button>
  <button class="tab-btn" onclick="swtab_biz_control('tp_biz_control_3',this)">Category Health</button>
</div>
<div id="tp_biz_control_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Tower</div>
</div>
<div id="tp_biz_control_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Store Pipeline</div>
</div>
<div id="tp_biz_control_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Store Health</div>
</div>
<div id="tp_biz_control_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Category Health</div>
</div>
<script>
function swtab_biz_control(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
