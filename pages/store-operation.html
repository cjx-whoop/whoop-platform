<!-- CJX Platform — Store Operations | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">Store Operations</div>
    <div class="ph-sub">Day-to-day operational health across the store network</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_store_operation('tp_store_operation_0',this)">Store Health</button>
  <button class="tab-btn" onclick="swtab_store_operation('tp_store_operation_1',this)">Daily Ops</button>
  <button class="tab-btn" onclick="swtab_store_operation('tp_store_operation_2',this)">Compliance</button>
  <button class="tab-btn" onclick="swtab_store_operation('tp_store_operation_3',this)">Incidents</button>
</div>
<div id="tp_store_operation_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Store Health</div>
</div>
<div id="tp_store_operation_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Daily Ops</div>
</div>
<div id="tp_store_operation_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Compliance</div>
</div>
<div id="tp_store_operation_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Incidents</div>
</div>
<script>
function swtab_store_operation(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
