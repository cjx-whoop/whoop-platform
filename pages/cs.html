<!-- CJX Platform — CS | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">CS</div>
    <div class="ph-sub">Customer service tickets, resolution rates, and escalations</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_cs('tp_cs_0',this)">Tickets</button>
  <button class="tab-btn" onclick="swtab_cs('tp_cs_1',this)">Resolution</button>
  <button class="tab-btn" onclick="swtab_cs('tp_cs_2',this)">Escalations</button>
  <button class="tab-btn" onclick="swtab_cs('tp_cs_3',this)">CSAT</button>
</div>
<div id="tp_cs_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Tickets</div>
</div>
<div id="tp_cs_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Resolution</div>
</div>
<div id="tp_cs_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Escalations</div>
</div>
<div id="tp_cs_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: CSAT</div>
</div>
<script>
function swtab_cs(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
