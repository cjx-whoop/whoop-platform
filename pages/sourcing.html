<!-- CJX Platform — S&P | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">S&P</div>
    <div class="ph-sub">Vendor management, contracts, and purchasing</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_sourcing('tp_sourcing_0',this)">Vendor Management</button>
  <button class="tab-btn" onclick="swtab_sourcing('tp_sourcing_1',this)">Contracts</button>
  <button class="tab-btn" onclick="swtab_sourcing('tp_sourcing_2',this)">Purchasing</button>
  <button class="tab-btn" onclick="swtab_sourcing('tp_sourcing_3',this)">Approvals</button>
</div>
<div id="tp_sourcing_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Vendor Management</div>
</div>
<div id="tp_sourcing_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Contracts</div>
</div>
<div id="tp_sourcing_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Purchasing</div>
</div>
<div id="tp_sourcing_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Approvals</div>
</div>
<script>
function swtab_sourcing(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
