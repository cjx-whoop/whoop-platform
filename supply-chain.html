<!-- CJX Platform — Supply Chain | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">Supply Chain</div>
    <div class="ph-sub">Inbound flow, stock levels, supplier performance, and logistics</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_supply_chain('tp_supply_chain_0',this)">Inbound Flow</button>
  <button class="tab-btn" onclick="swtab_supply_chain('tp_supply_chain_1',this)">Stock Levels</button>
  <button class="tab-btn" onclick="swtab_supply_chain('tp_supply_chain_2',this)">Supplier Performance</button>
  <button class="tab-btn" onclick="swtab_supply_chain('tp_supply_chain_3',this)">Logistics</button>
</div>
<div id="tp_supply_chain_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Inbound Flow</div>
</div>
<div id="tp_supply_chain_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Stock Levels</div>
</div>
<div id="tp_supply_chain_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Supplier Performance</div>
</div>
<div id="tp_supply_chain_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Logistics</div>
</div>
<script>
function swtab_supply_chain(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
