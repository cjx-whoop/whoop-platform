<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CJX Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f5;--surface:#fff;--s2:#f7f8fa;--s3:#eef0f4;
  --border:#e3e6ed;--border2:#c8cdd9;
  --text:#0d1421;--t2:#4a5568;--t3:#8a93a8;--t4:#b8bece;
  --green:#0ca678;--gbg:#ecfdf5;--gmid:#a7f3d0;
  --yellow:#c67e00;--ybg:#fffbeb;--ymid:#fcd34d;
  --red:#dc2626;--rbg:#fef2f2;--rmid:#fca5a5;
  --blue:#1d4ed8;--bbg:#eff6ff;--bmid:#bfdbfe;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;line-height:1.5;}
.shell{display:grid;grid-template-columns:220px 1fr;grid-template-rows:52px 1fr;height:100vh;}
.topbar{grid-column:1/-1;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;}
.logo{font-weight:800;font-size:16px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;}
.logo-mark{width:28px;height:28px;background:var(--text);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;}
.tb-div{width:1px;height:18px;background:var(--border);}
.tb-lbl{font-size:12px;color:var(--t3);font-weight:500;}
.tb-sep{flex:1;}
.role-wrap{display:flex;align-items:center;gap:7px;}
.role-label{font-size:11px;color:var(--t3);font-weight:600;}
.role-sel{background:var(--s2);border:1px solid var(--border2);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--text);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;outline:none;}
.live-pill{display:flex;align-items:center;gap:6px;background:var(--gbg);border:1px solid var(--gmid);border-radius:20px;padding:3px 10px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
.live-txt{font-size:11px;font-weight:700;color:var(--green);}
.tb-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3);}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.75);}}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:14px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;overflow-x:hidden;transition:width .2s;}
.sidebar.collapsed{width:0!important;padding:0;border-right:none;}
.sidebar.collapsed *{display:none!important;}
.nav-sec{padding:10px 8px 3px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t4);font-weight:700;font-family:'JetBrains Mono',monospace;}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:pointer;transition:all .12s;font-size:12.5px;color:var(--t2);font-weight:500;border-radius:7px;white-space:nowrap;overflow:hidden;}
.nav-item:hover{background:var(--s2);color:var(--text);}
.nav-item.active{background:var(--bbg);color:var(--blue);font-weight:600;}
.nav-icon{font-size:13px;width:16px;flex-shrink:0;text-align:center;}
.nav-fn-sec{padding:8px 8px 2px 10px;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--t4);font-weight:700;font-family:'JetBrains Mono',monospace;margin-top:2px;}
.nav-sub{display:flex;align-items:center;gap:9px;padding:6px 10px 6px 22px;cursor:pointer;transition:all .12s;font-size:12px;color:var(--t2);font-weight:500;border-radius:7px;white-space:nowrap;overflow:hidden;}
.nav-sub:hover{background:var(--s2);color:var(--text);}
.nav-sub.active{background:var(--bbg);color:var(--blue);font-weight:600;}
.nav-sub-icon{font-size:12px;width:14px;flex-shrink:0;text-align:center;}
.main{overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0;}
/* Loading state */
.page-loading{display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--t4);font-size:12px;font-family:'JetBrains Mono',monospace;letter-spacing:.5px;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fadein{animation:fadeUp .25s ease both;}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button id="hamburger" onclick="toggleSidebar()" style="background:none;border:none;cursor:pointer;padding:8px;font-size:18px;color:var(--t2);line-height:1;margin-right:4px;">☰</button>
    <div class="logo"><div class="logo-mark">CJX</div>CJX Platform</div>
    <div class="tb-div"></div>
    <div class="tb-lbl" id="page-label">–</div>
    <div class="tb-sep"></div>
    <div class="live-pill"><div class="live-dot"></div><span class="live-txt">LIVE</span></div>
    <div class="tb-time" id="clock">--:--:--</div>
    <div class="tb-div"></div>
    <div class="role-wrap">
      <span class="role-label">Role</span>
      <select class="role-sel" id="roleSel" onchange="onRoleChange()">
        <optgroup label="Executive">
          <option value="md">Managing Director</option>
          <option value="bsa">Head of BSA</option>
        </optgroup>
        <optgroup label="Expansion">
          <option value="head-expansion">Head of Site Expansion</option>
          <option value="head-negotiation">Head of Site Negotiation</option>
          <option value="head-construction">Head of Construction</option>
        </optgroup>
        <optgroup label="Operation">
          <option value="head-operation">Head of Operation</option>
          <option value="head-lpic">Head of LPIC</option>
        </optgroup>
        <optgroup label="Sales & Supply">
          <option value="head-commercial">Head of Commercial</option>
          <option value="head-supplychain">Head of Supply Chain</option>
        </optgroup>
        <optgroup label="Activities">
          <option value="head-nsa">Head of NSA</option>
          <option value="head-storepartnership">Head of Store Partnership</option>
          <option value="head-marketing">Head of Marketing</option>
        </optgroup>
        <optgroup label="Backbone">
          <option value="head-af">Head of A&amp;F</option>
          <option value="head-sp">Head of S&amp;P</option>
          <option value="head-people">Head of People</option>
          <option value="head-legal">Head of Legal</option>
        </optgroup>
        <optgroup label="Technology">
          <option value="head-tech">Head of Technology</option>
        </optgroup>
        <optgroup label="Field Operations">
          <option value="rc">RC Director</option>
          <option value="rm">Regional Manager (RM)</option>
          <option value="am">Area Manager (AM)</option>
          <option value="sm">Store Manager (SM)</option>
          <option value="asst">Assistant Store Manager</option>
        </optgroup>
      </select>
    </div>
  </header>
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>
<script>
// ── STATE ─────────────────────────────────────────────
let role = 'md';
let page = 'me';
let sidebarCollapsed = false;

// ── PAGE → FILE MAPPING ───────────────────────────────
// Each key maps to a file in /pages/
const PAGE_FILES = {
  me:              'pages/me.html',
  team:            'pages/team.html',
  bizcontrol:      'pages/biz-control.html',
  commercial:      'pages/commercial.html',
  expansion:       'pages/expansion.html',
  negotiation:     'pages/negotiation.html',
  construction:    'pages/construction.html',
  storeoperation:  'pages/store-operation.html',
  controltower:    'pages/control-tower.html',
  operhr:          'pages/oper-hr.html',
  cs:              'pages/cs.html',
  lpic:            'pages/lpic.html',
  supplychain:     'pages/supply-chain.html',
  nsa:             'pages/nsa.html',
  storepartnership:'pages/store-partnership.html',
  marketing:       'pages/marketing.html',
  af:              'pages/finance.html',
  sp:              'pages/sourcing.html',
  people:          'pages/people.html',
  legal:           'pages/legal.html',
  tech:            'pages/tech.html',
  itsupport:       'pages/it-support.html',
};

const PAGE_LABELS = {
  me:'Me', team:'Team', bizcontrol:'Business Control',
  commercial:'Commercial', expansion:'Site Expansion',
  negotiation:'Site Negotiation', construction:'Construction',
  storeoperation:'Store Operations', controltower:'Store Control Tower',
  operhr:'Oper HR', cs:'CS', lpic:'LPIC',
  supplychain:'Supply Chain', nsa:'NSA',
  storepartnership:'Store Partnership', marketing:'Marketing',
  af:'A&F', sp:'S&P', people:'People', legal:'Legal',
  tech:'Tech', itsupport:'IT Support',
};

// ── CLOCK ─────────────────────────────────────────────
function startClock(){
  function tick(){
    const n=new Date(),el=document.getElementById('clock');
    if(el) el.textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')} ICT`;
  }
  tick(); setInterval(tick,1000);
}

// ── SIDEBAR TOGGLE ────────────────────────────────────
function toggleSidebar(){
  sidebarCollapsed=!sidebarCollapsed;
  const sb=document.getElementById('sidebar');
  const shell=document.querySelector('.shell');
  if(sidebarCollapsed){
    sb.classList.add('collapsed');
    shell.style.gridTemplateColumns='0 1fr';
  } else {
    sb.classList.remove('collapsed');
    shell.style.gridTemplateColumns='220px 1fr';
  }
}

// ── DEFAULT PAGE PER ROLE ─────────────────────────────
function defaultPage(r){
  if(r==='md'||r==='bsa') return 'me';
  const map={
    'head-expansion':'expansion','head-negotiation':'negotiation',
    'head-construction':'construction','head-operation':'storeoperation',
    'head-lpic':'lpic','head-commercial':'commercial',
    'head-supplychain':'supplychain','head-nsa':'nsa',
    'head-storepartnership':'storepartnership','head-marketing':'marketing',
    'head-af':'af','head-sp':'sp','head-people':'people',
    'head-legal':'legal','head-tech':'tech',
    'rc':'bizcontrol','rm':'storeoperation','am':'storeoperation',
    'sm':'storeoperation','asst':'storeoperation',
  };
  return map[r]||'me';
}

// ── ROLE CHANGE ───────────────────────────────────────
function onRoleChange(){
  role=document.getElementById('roleSel').value;
  page=defaultPage(role);
  renderSidebar();
  loadPage(page);
}

// ── NAV ───────────────────────────────────────────────
function goPage(p, el){
  page=p;
  document.querySelectorAll('.nav-item,.nav-sub').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  loadPage(p);
}

// ── PAGE LOADER ───────────────────────────────────────
async function loadPage(p){
  const main = document.getElementById('main');
  const label = document.getElementById('page-label');
  if(label) label.textContent = PAGE_LABELS[p] || p;

  const file = PAGE_FILES[p];
  if(!file){ main.innerHTML='<div class="page-loading">Page not mapped.</div>'; return; }

  main.innerHTML='<div class="page-loading">Loading…</div>';
  try {
    const res = await fetch(file);
    if(!res.ok) throw new Error(`${res.status}`);
    const html = await res.text();
    main.innerHTML = html;
    // Run any inline scripts in the loaded page
    main.querySelectorAll('script').forEach(old=>{
      const s=document.createElement('script');
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
  } catch(e){
    main.innerHTML=`<div class="page-loading">⚠ Could not load ${file} — build this page next.</div>`;
  }
}

// ── SIDEBAR BUILDER ───────────────────────────────────
function renderSidebar(){
  const r=role;
  const isExec   = r==='md'||r==='bsa';
  const isField  = ['rc','rm','am','sm','asst'].includes(r);

  const item=(p,icon,label)=>`<div class="nav-item${page===p?' active':''}" onclick="goPage('${p}',this)"><span class="nav-icon">${icon}</span>${label}</div>`;
  const sub =(p,icon,label)=>`<div class="nav-sub${page===p?' active':''}" onclick="goPage('${p}',this)"><span class="nav-sub-icon">${icon}</span>${label}</div>`;
  const sec =(t)=>`<div class="nav-sec">${t}</div>`;
  const fn  =(t)=>`<div class="nav-fn-sec">${t}</div>`;

  let html=sec('Main');
  html+=item('me','👤','Me');
  html+=item('team','👥','Team');
  html+=item('bizcontrol','⊙','Business Control');
  html+=sec('Functions');

  // Expansion
  const showExpAll = isExec||r==='head-expansion'||r==='head-negotiation'||r==='head-construction';
  const showExp    = isExec||r==='head-expansion';
  const showNeg    = isExec||r==='head-negotiation';
  const showCon    = isExec||r==='head-construction';
  if(showExpAll){
    html+=fn('Expansion');
    if(showExp) html+=sub('expansion','🗺','Site Expansion');
    if(showNeg) html+=sub('negotiation','🤝','Site Negotiation');
    if(showCon) html+=sub('construction','🏗','Construction');
  }

  // Operation
  const showOpAll  = isExec||r==='head-operation'||r==='head-lpic'||isField;
  const showOps    = isExec||r==='head-operation'||isField;
  const showLpic   = isExec||r==='head-lpic';
  if(showOpAll){
    html+=fn('Operation');
    if(showOps){
      html+=sub('storeoperation','🏪','Store Operations');
      html+=sub('controltower','🗼','Store Control Tower');
      html+=sub('operhr','👤','Oper HR');
      if(isExec||r==='head-operation') html+=sub('cs','🎫','CS');
    }
    if(showLpic) html+=sub('lpic','🔒','LPIC');
  }

  // Sales & Supply
  const showCom  = isExec||r==='head-commercial';
  const showSC   = isExec||r==='head-supplychain';
  if(showCom||showSC){
    html+=fn('Sales & Supply');
    if(showCom) html+=sub('commercial','🛍','Commercial');
    if(showSC)  html+=sub('supplychain','📦','Supply Chain');
  }

  // Activities
  const showNsa  = isExec||r==='head-nsa';
  const showSP   = isExec||r==='head-storepartnership';
  const showMkt  = isExec||r==='head-marketing';
  if(showNsa||showSP||showMkt){
    html+=fn('Activities');
    if(showNsa) html+=sub('nsa','🎉','NSA');
    if(showSP)  html+=sub('storepartnership','🤲','Store Partnership');
    if(showMkt) html+=sub('marketing','📣','Marketing');
  }

  // Backbone
  const showAF   = isExec||r==='head-af';
  const showSPr  = isExec||r==='head-sp';
  const showPpl  = isExec||r==='head-people';
  const showLgl  = isExec||r==='head-legal';
  if(showAF||showSPr||showPpl||showLgl){
    html+=fn('Backbone');
    if(showAF)  html+=sub('af','💰','A&F');
    if(showSPr) html+=sub('sp','🛒','S&P');
    if(showPpl) html+=sub('people','🧑‍🤝‍🧑','People');
    if(showLgl) html+=sub('legal','⚖️','Legal');
  }

  // Technology
  const showTech = isExec||r==='head-tech';
  if(showTech){
    html+=fn('Technology');
    html+=sub('tech','💻','Tech');
    if(isExec) html+=sub('itsupport','🛠','IT Support');
  }

  document.getElementById('sidebar').innerHTML=html;
}

// ── BOOT ──────────────────────────────────────────────
window.onload=function(){
  startClock();
  renderSidebar();
  loadPage(page);
};
</script>
</body>
</html>
