<!-- CJX Platform — Store Control Tower | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">Store Control Tower</div>
    <div class="ph-sub">Real-time operational overview — key alerts, live KPIs, and urgent issues</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_control_tower('tp_control_tower_0',this)">Live Overview</button>
  <button class="tab-btn" onclick="swtab_control_tower('tp_control_tower_1',this)">Alerts</button>
  <button class="tab-btn" onclick="swtab_control_tower('tp_control_tower_2',this)">KPI Dashboard</button>
  <button class="tab-btn" onclick="swtab_control_tower('tp_control_tower_3',this)">Escalations</button>
</div>
<div id="tp_control_tower_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Live Overview</div>
</div>
<div id="tp_control_tower_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Alerts</div>
</div>
<div id="tp_control_tower_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: KPI Dashboard</div>
</div>
<div id="tp_control_tower_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Escalations</div>
</div>
<script>
function swtab_control_tower(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
