<!-- CJX Platform — Construction | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">Construction</div>
    <div class="ph-sub">Active construction projects, timelines, contractor status, and risk flags</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_construction('tp_construction_0',this)">Active Projects</button>
  <button class="tab-btn" onclick="swtab_construction('tp_construction_1',this)">Timeline</button>
  <button class="tab-btn" onclick="swtab_construction('tp_construction_2',this)">Contractor Status</button>
  <button class="tab-btn" onclick="swtab_construction('tp_construction_3',this)">Risk Flags</button>
</div>
<div id="tp_construction_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Active Projects</div>
</div>
<div id="tp_construction_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Timeline</div>
</div>
<div id="tp_construction_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Contractor Status</div>
</div>
<div id="tp_construction_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Risk Flags</div>
</div>
<script>
function swtab_construction(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
