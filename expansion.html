<!-- CJX Platform — Site Expansion | Owner: assign to team member -->
<div class="ph fadein">
  <div>
    <div class="ph-title">Site Expansion</div>
    <div class="ph-sub">Pipeline of potential new sites — prospecting, scoring, and status tracking</div>
  </div>
</div>
<div class="tab-bar fadein">
  <button class="tab-btn active" onclick="swtab_expansion('tp_expansion_0',this)">Overview</button>
  <button class="tab-btn" onclick="swtab_expansion('tp_expansion_1',this)">Pipeline</button>
  <button class="tab-btn" onclick="swtab_expansion('tp_expansion_2',this)">Site Scoring</button>
  <button class="tab-btn" onclick="swtab_expansion('tp_expansion_3',this)">Site Visit Log</button>
</div>
<div id="tp_expansion_0" class="tab-pane fadein">
  <div class="sec-blank" style="min-height:300px;">Build: Overview</div>
</div>
<div id="tp_expansion_1" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Pipeline</div>
</div>
<div id="tp_expansion_2" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Site Scoring</div>
</div>
<div id="tp_expansion_3" class="tab-pane fadein" style="display:none;">
  <div class="sec-blank" style="min-height:300px;">Build: Site Visit Log</div>
</div>
<script>
function swtab_expansion(id, btn){
  document.querySelectorAll('.tab-pane').forEach(d=>d.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){ el.style.display=''; el.classList.add('fadein'); }
  if(btn) btn.classList.add('active');
}
</script>
